<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- 裁判長(オリジナルの素材。太い主線とセル塗りのアニメ調。髪を後ろで束ねる・丸眼鏡・笑顔) -->
  <g stroke="#2a1a14" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 後ろで束ねた髪(首の後ろから毛先がのぞく) -->
    <path d="M104 96 Q124 98 127 114 Q128 126 121 136 Q114 128 112 116 Q110 106 104 96 Z" fill="#221c24"/>
    <path d="M118 108 Q122 118 120 128" fill="none" stroke="#4a4150" stroke-width="1.6"/>
    <!-- 後ろ髪 -->
    <path d="M64 88 Q58 38 100 32 Q142 38 136 88 Q126 70 100 66 Q74 70 64 88 Z" fill="#221c24"/>

    <!-- 法服 -->
    <path d="M34 240 L46 136 Q56 122 82 122 L100 150 L118 122 Q144 122 154 136 L166 240 Z" fill="#1d1b28"/>
    <path d="M58 150 L52 240 M142 150 L148 240" fill="none" stroke="#3a3650" stroke-width="2"/>
    <!-- ストール -->
    <path d="M82 122 L100 168 L118 122 Q100 134 82 122 Z" fill="#9aa3aa"/>
    <path d="M92 138 L100 158 M108 138 L100 158" fill="none" stroke="#6f787f" stroke-width="1.6"/>

    <!-- 首 -->
    <path d="M90 108 L90 124 Q100 132 110 124 L110 108 Z" fill="#f0cdb0"/>

    <!-- 耳 -->
    <path d="M69 84 Q61 82 62 92 Q64 101 71 100 Z" fill="#f3d4b8"/>
    <path d="M131 84 Q139 82 138 92 Q136 101 129 100 Z" fill="#f3d4b8"/>

    <!-- 顔 -->
    <path d="M69 78 Q68 110 100 119 Q132 110 131 78 Q130 50 100 48 Q70 50 69 78 Z" fill="#f6dcc3"/>
  </g>

  <!-- 顔の影(セル塗り) -->
  <path d="M71 76 Q86 64 100 66 Q116 64 129 76 Q128 68 122 62 Q100 56 78 62 Q72 68 71 76 Z" fill="#e6bf9f"/>
  <path d="M90 116 Q100 120 110 116 Q106 122 100 122 Q94 122 90 116 Z" fill="#dcb293"/>

  <g stroke="#2a1a14" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 前髪(後ろにまとめ、額を出して横に流す) -->
    <path d="M66 82 Q62 44 100 38 Q138 42 134 80 Q130 62 116 54 Q108 62 92 62 Q80 62 72 70 Q68 76 66 82 Z" fill="#221c24"/>
    <!-- 後ろへ梳かした毛筋 -->
    <path d="M78 62 Q84 48 98 42 M122 58 Q116 48 104 42" fill="none" stroke="#4a4150" stroke-width="1.8"/>
    <!-- 後れ毛 -->
    <path d="M69 74 Q64 90 68 106" fill="none" stroke-width="1.6"/>
    <path d="M131 72 Q137 88 133 102" fill="none" stroke-width="1.6"/>
    <path d="M112 36 Q118 26 128 24" fill="none" stroke-width="1.4"/>

    <!-- 眉 -->
    <path d="M78 72 Q85 68 93 71" fill="none" stroke-width="2"/>
    <path d="M107 71 Q115 68 122 72" fill="none" stroke-width="2"/>

    <!-- 目(笑顔で細めた、やさしい目) -->
    <ellipse cx="86" cy="86.6" rx="3.2" ry="1.4" fill="#3b2a26" stroke="none"/>
    <ellipse cx="114" cy="86.6" rx="3.2" ry="1.4" fill="#3b2a26" stroke="none"/>
    <path d="M79 86.8 Q86 82.6 93 86.2" fill="none" stroke-width="2.8"/>
    <path d="M107 86.2 Q114 82.6 121 86.8" fill="none" stroke-width="2.8"/>
    <path d="M82 88.4 Q86 89.4 90 88.4 M110 88.4 Q114 89.4 118 88.4" fill="none" stroke-width="1.1"/>

    <!-- 鼻 -->
    <path d="M101 90 Q98 97 100 99 Q102 99.5 104 98" fill="none" stroke-width="1.6"/>

    <!-- 口(歯を見せて笑う) -->
    <path d="M87 104 Q100 118 113 104 Q100 108 87 104 Z" fill="#8e3434"/>
  </g>
  <path d="M89.5 105.2 Q100 108.6 110.5 105.2 L109.6 107.6 Q100 110.6 90.4 107.6 Z" fill="#ffffff"/>
  <path d="M95 112 Q100 114 105 112 Q100 115.5 95 112 Z" fill="#d86a6a"/>
  <!-- 目の光・笑いじわ -->
  <circle cx="87.2" cy="86.4" r="0.6" fill="#ffffff"/>
  <circle cx="115.2" cy="86.4" r="0.6" fill="#ffffff"/>
  <path d="M85 102 Q84 106 87 108 M115 102 Q116 106 113 108" fill="none" stroke="#d4a487" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- 頬 -->
  <ellipse cx="80" cy="98" rx="6" ry="3" fill="#f39a9a" opacity="0.5"/>
  <ellipse cx="120" cy="98" rx="6" ry="3" fill="#f39a9a" opacity="0.5"/>

  <!-- 丸眼鏡(細い金属フレーム) -->
  <g fill="#ffffff" fill-opacity="0.12" stroke="#7d848c" stroke-width="1.6">
    <circle cx="86" cy="86" r="12"/>
    <circle cx="114" cy="86" r="12"/>
  </g>
  <path d="M98 85 Q100 82 102 85 M74 85 L67 82 M126 85 L133 82" fill="none" stroke="#7d848c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M79 80 L83 77 M107 80 L111 77" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- 裁判長席と木槌 -->
  <rect x="20" y="170" width="160" height="70" rx="6" fill="#4a2f1b" stroke="#2a1a14" stroke-width="2.2"/>
  <rect x="20" y="170" width="160" height="8" rx="3" fill="#6b4528"/>
  <rect x="120" y="176" width="44" height="12" rx="3" fill="#a8733f" stroke="#2a1a14" stroke-width="2"/>
  <rect x="146" y="160" width="10" height="28" rx="3" fill="#7a4f2a" stroke="#2a1a14" stroke-width="2"/>
</svg>
