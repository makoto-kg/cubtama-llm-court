          reasoning: プロフィールにタマの体重が書いてあるから、タマには無理だ
          learning_point_id: LP-02
          why_tempting: 体重はわかるが、戸棚を開けるのにどれだけの重さが要るかは、プロフィールだけではわからない
    - id: X-04
      testimony_line_id: TS-02-2
      evidence_id: CE-06
      lie_id: L-04
      learning_point_ids: [LP-03]
      explanation: カブは「まぐろ味なんて好きじゃない」と証言したが、ゆさぶったときに「大好きなまぐろ味」と口をすべらせた。なくなったのはまぐろ味だけで(飼い主さんのメモ)、タマの好物はささみ味(プロフィール)。まぐろ味を食べたのはカブだ。
      traps:
