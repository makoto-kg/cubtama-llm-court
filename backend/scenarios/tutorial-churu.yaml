responses:
  # --- 証言 1: ぼくは知らないにゃ(カブの証言はまだ手に入らない) ---
  probe:TS-01-1: "ソファのあたりはふかふかで最高なんだにゃ。朝までずーっとゴロゴロしてたにゃ。……ほんとだにゃ。"
  present:TS-01-1:CE-01: "空っぽの袋がソファの下に? ふ、ふーん。ぼくはソファの「上」でゴロゴロしてたから、下のことは知らないにゃ。"
  present:TS-01-1:CE-02: "戸棚が開いてたにゃ? ぼくはソファでゴロゴロしてたから、台所のことは知らないにゃ。"
  present:TS-01-1:CE-03: "ぼくのプロフィールにゃ? 体重6kg……ちょ、ちょっとふくよかなだけだにゃ! ゴロゴロしてたのとは関係ないにゃ。"
  present:TS-01-1:CE-04: "足跡がソファのほうへ続いてる? ソファのあたりにいたんだから、足跡くらいあってもおかしくないにゃ。"
  present:TS-01-1:CE-05: "戸棚の扉が重い? ソファでゴロゴロしてたぼくには、関係ない話だにゃ。"
  probe:TS-01-2: "台所なんて、行く用事がないにゃ。ずっとソファのそばにいたって言ってるにゃ。(しっぽがそわそわ揺れている)"
  present:TS-01-2:CE-01: "空の袋はソファの下で見つかったんだにゃ? 台所じゃないにゃ。ほら、ぼくは台所には入ってないにゃ。"
  present:TS-01-2:CE-02: "戸棚が開いてたからって、ぼくが台所に入った証拠にはならないにゃ!"
  present:TS-01-2:CE-03: "プロフィールに「台所に入った」なんて書いてないにゃ。"
  present:TS-01-2:CE-04: "に゛ゃっ!? 直径4cmの肉球……それは……ぼくの足にゃ……。タマの足はもっと小さいにゃ……。そ、そうだにゃ、ちょっとだけ台所に行ったにゃ……。"
  present:TS-01-2:CE-05: "戸棚の扉のことなんて知らないにゃ。台所には行ってないんだから。"
  probe:TS-01-3: "袋なんて見たこともないにゃ。チュールの袋がどんな形かも知らないにゃ……(しっぽがぶんぶん揺れている)"
  present:TS-01-3:CE-01: "にゃ、にゃにゃっ!? しま模様の茶色の毛……それは……ぼくの毛にゃ……。ごめんなさいにゃ。夜中にいいにおいがして、つい……。"
  present:TS-01-3:CE-02: "戸棚が開いてたのは知ってるにゃ。でも、開いてたからって、ぼくが袋にさわった証拠にはならないにゃ!"
  present:TS-01-3:CE-03: "ぼくのプロフィールがどうしたにゃ? 茶トラ白でかわいい、それだけのことにゃ。"
  present:TS-01-3:CE-04: "足跡がソファのほうへ? それがどうして袋の話になるにゃ。"
  present:TS-01-3:CE-05: "戸棚の扉と袋は関係ないにゃ。ぼくは袋にさわってないにゃ。"
  # --- 証言 2: 犯人はタマだにゃ(3 行目をゆさぶると「カブの証言」が手に入る) ---
  probe:TS-02-1: "タマはああ見えて、前足で何でも開けちゃうんだにゃ。戸棚くらい、ちょちょいのちょいにゃ。"
  present:TS-02-1:CE-01: "空の袋? 戸棚を開けたのがタマなら、食べたのもタマにゃ。"
  present:TS-02-1:CE-02: "戸棚が開いてた……そうにゃ、タマが開けたからにゃ!"
  present:TS-02-1:CE-03: "タマは3.2kg? 小さくても、タマの前足は器用なんだにゃ。体重なんて関係ないにゃ!"
  present:TS-02-1:CE-04: "足跡? 台所に行ったのは認めたにゃ。でも、戸棚を開けたのはタマにゃ。"
  present:TS-02-1:CE-05: "5kg以上……!? タマは3.2kgだから……開けられないにゃ……。……体重をかけて扉を押し開けたのは……ぼくだにゃ……。"
  present:TS-02-1:CE-06: "ぼくが何を言ったって? 今は戸棚の話にゃ。戸棚を開けたのはタマだにゃ!"
  probe:TS-02-2: "まぐろ味なんて、においをかぐのもいやだにゃ。ほんとだにゃ。……ほんとだにゃ。"
  present:TS-02-2:CE-01: "袋がまぐろ味だった? それはタマがまぐろ味を食べたってことにゃ。ぼくの好みとは関係ないにゃ!"
  present:TS-02-2:CE-02: "まぐろ味だけなくなってた? だから、タマが食べたんだにゃ。"
  present:TS-02-2:CE-03: "タマの好物はささみ味? ……た、たまには違う味も食べたくなるにゃ、タマだって。"
  present:TS-02-2:CE-04: "足跡は台所の話にゃ。味の好みとは関係ないにゃ。"
  present:TS-02-2:CE-05: "戸棚の扉は関係ないにゃ。ぼくはまぐろ味が好きじゃないって話をしてるにゃ。"
  present:TS-02-2:CE-06: "にゃにゃっ!? ぼく、「大好きなまぐろ味」って……言っちゃったにゃ……。……そうにゃ、まぐろ味は大好物だにゃ。がまんできなかったにゃ……。"
  probe:TS-02-3: "タマはいつもお腹をすかせてるんだにゃ。ぼくなんて、大好きなまぐろ味のチュールを、ずっとがまんしてたんだにゃ! ……にゃ?"
  present:TS-02-3:CE-01: "空の袋を見るとお腹がすくにゃ……じゃなくて、食べたのはタマにゃ。"
  present:TS-02-3:CE-02: "なくなったのはまぐろ味だけ? 食いしん坊のタマが食べたにゃ。"
  present:TS-02-3:CE-03: "タマは3.2kgの小さい猫だにゃ。だからいつもお腹をすかせてるにゃ。"
  present:TS-02-3:CE-04: "足跡? タマはこっそり歩くのがうまいんだにゃ。"
  present:TS-02-3:CE-05: "戸棚の扉が重くても、タマはお腹がすいてたから、がんばったんだにゃ。"
  present:TS-02-3:CE-06: "ぼくの言ったこと? タマの話をしてるのに、ぼくのことはいいにゃ。"
