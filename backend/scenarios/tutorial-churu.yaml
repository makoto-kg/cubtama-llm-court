      lie_id: L-03
      learning_point_ids: [LP-02]
      explanation: 戸棚の扉は、5kg以上の重さでもたれかからないと開かない。タマの体重は3.2kgなので開けられない。開けられるのは、体重6kgのカブだけ。
      traps:
