# チュートリアル「消えたチュール事件」(台本のパック。ADR 0016)
#
# パックにする: uv run llm-court offline scripted scenarios/tutorial-churu.yaml
# 応答(responses)は、起こりうる全行動(全行の「ゆさぶる」と、全行 × 手元にありうる全証拠品の「つきつける」)に書く。
# 尋問の中で手に入る証拠品(evidence_unlocks)は、手に入る証言とそれより後の証言でだけつきつけられる(ADR 0019)。
tutorial: true
case:
  id: tutorial-churu
  theme: チュートリアル(証言の矛盾を見つけて、証拠品をつきつける)
  title: 消えたチュール事件
  created_at: "2026-09-28T00:00:00Z"
  overview: ある家の台所で、猫用おやつのチュールが1本消えた。被告は、食いしん坊の茶トラ白猫・カブ。カブの証言と証拠品を見比べて、食い違うところに証拠品を「つきつける」のが、この裁判の目標だ。手がかりが足りないときは「ゆさぶる」で、話を詳しく聞いてみよう。
  question:
    text: 消えたチュール事件の真相として正しいのはどれ?
    options:
      - 体重の重いカブが戸棚を押し開け、大好きなまぐろ味のチュールを食べた
      - 前足の器用なタマが戸棚を開け、まぐろ味のチュールを食べた
      - 飼い主さんが戸棚を閉め忘れ、近所のカラスが持ち去った
      - カブとタマが、ささみ味のチュールを分け合って食べた
    answer_index: 0
  people:
    - id: P-01
      name: カブ
      role: 被告(茶トラ白猫)
      description: 食いしん坊の茶トラ白猫。毛は茶色のしま模様と白
    - id: P-02
      name: タマ
      role: 同居猫(三毛猫)
      description: カブと同じ家に住む三毛猫。毛は白・茶・黒のまだら
    - id: P-03
      name: 飼い主さん
      role: 飼い主
      description: カブとタマの飼い主。チュールを戸棚にしまっていた
  defendant_id: P-01
  # 検察官(プレイヤー)はタマが演じる。名札は「タマ（検察官）」
  prosecutor_id: P-02
  prosecutor_speech: cat
  evidence:
    - id: CE-01
      name: 空のチュールの袋
      description: ソファの下から見つかった、空っぽのチュールの袋
      details:
        - 味は「まぐろ味」
        - 袋のはしに、しま模様の入った茶色の毛が1本ついていた
    - id: CE-02
      name: 飼い主さんのメモ
      description: 飼い主さんが朝に書いたメモ
      details:
        - 夜9時、まぐろ味とささみ味のチュールを1本ずつ、戸棚の2段目にしまった
        - 朝7時、戸棚の扉が開いていて、まぐろ味だけがなくなっていた。ささみ味は残っていた
    - id: CE-03
      name: ねこたちのプロフィール
      description: この家の猫たちの紹介カード
      details:
        - カブ:茶トラ白猫。毛は茶色のしま模様と白。体重6kg。肉球は大きめ(直径およそ4cm)
        - タマ:三毛猫。毛は白・茶・黒のまだらで、しま模様はない。体重3.2kg。肉球は小さめ(直径およそ2.5cm)。好物はささみ味
    - id: CE-04
      name: 台所の床の足跡
      description: 台所の床にこぼれていた小麦粉に残っていた、肉球の足跡
      details:
        - 肉球の大きさは直径およそ4cm
        - 足跡は戸棚の前から、ソファのほうへ続いていた
    - id: CE-05
      name: 戸棚の扉
      description: チュールをしまっていた、台所の戸棚の扉
      details:
        - 扉は重く、押し開けるには5kg以上の重さでもたれかかる必要がある
        - 飼い主さんが4kgの米袋を立てかけてみたが、扉は開かなかった
    - id: CE-06
      name: カブの証言
      description: 尋問の途中で、カブがうっかり口にしたこと
      details:
        - 「大好きなまぐろ味のチュールを、ずっとがまんしてたんだにゃ」と言った
  verdict:
    sentence: 3日間のおやつ抜き。それから、タマに毛づくろいでおわびすること
    defendant_reaction: にゃ、にゃんですと……!? 3日間も、おやつ抜き……。まぐろ味のチュール、あとひと口だけ食べたかったにゃ……。タマ、ごめんにゃ……。
  evidence_unlocks:
    - evidence_id: CE-06
      kind: probe
      line_id: TS-02-3
  testimonies:
    - id: TS-01
      witness_id: P-01
      title: カブの証言 〜ぼくは知らないにゃ〜
      lines:
        - id: TS-01-1
          text: 昨日の夜は、ずっとソファのあたりでゴロゴロしてたにゃ
        - id: TS-01-2
          text: 台所には、一歩も入ってないにゃ
          lie_id: L-01
        - id: TS-01-3
          text: チュールの袋なんて、さわってもいないにゃ
          lie_id: L-02
    - id: TS-02
      witness_id: P-01
      title: カブの証言 〜犯人はタマだにゃ〜
      lines:
        - id: TS-02-1
          text: 戸棚を開けたのはタマだにゃ。タマは前足が器用なんだにゃ
          lie_id: L-03
        - id: TS-02-2
          text: だいたい、ぼくはまぐろ味なんて好きじゃないにゃ
          lie_id: L-04
        - id: TS-02-3
          text: タマはいつもお腹をすかせてるにゃ。夜中にごそごそしてたのはタマにゃ
  learning_points:
    - id: LP-01
      knowledge: 証言の矛盾は、その証言の内容を直接くつがえす証拠品でつく
      explanation: 「袋にさわってもいない」という証言をくつがえすには、カブが袋にさわった跡を示す証拠品が要る。空の袋についていたしま模様の茶色の毛は、茶トラ白のカブの毛なので、それにあたる(三毛のタマの毛にしま模様はない)。戸棚が開いていたこと(飼い主さんのメモ)は、事件が起きたことは示しても、誰がやったかまでは示さない。
      sources:
        - evidence_id: CE-01
          title: 証拠品「空のチュールの袋」
          url: ""
          quote: 袋のはしに、しま模様の入った茶色の毛が1本ついていた
      misconception: 事件に関係のある証拠品なら、どの証言につきつけても崩れる
    - id: LP-02
      knowledge: 1つの証拠品で決まらないときは、別の証拠品と組み合わせて考える
      explanation: 足跡の大きさや、戸棚を開けるのに要る重さは、それだけでは誰のことかわからない。プロフィールの肉球の大きさ・体重と組み合わせると、どちらもカブだと決まる。
      sources:
        - evidence_id: CE-04
          title: 証拠品「台所の床の足跡」
          url: ""
          quote: 肉球の大きさは直径およそ4cm
        - evidence_id: CE-05
          title: 証拠品「戸棚の扉」
          url: ""
          quote: 扉は重く、押し開けるには5kg以上の重さでもたれかかる必要がある
      misconception: 1つだけで決め手にならない証拠品は、役に立たない
    - id: LP-03
      knowledge: 「ゆさぶる」で話を詳しく聞くと、被告が口をすべらせて、新しい証拠品が手に入ることがある
      explanation: つきつける証拠品が見つからないときは、怪しい証言をゆさぶってみる。カブは「大好きなまぐろ味」と口をすべらせ、それが「まぐろ味なんて好きじゃない」という証言をくつがえす証拠品になった。
      sources:
        - evidence_id: CE-06
          title: 証拠品「カブの証言」
          url: ""
          quote: 「大好きなまぐろ味のチュールを、ずっとがまんしてたんだにゃ」と言った
      misconception: 証拠品は初めに渡されたものだけで、尋問の中で増えることはない
  hidden_truth:
    summary: 夜中の2時ごろ、体重6kgのカブは重い戸棚の扉に体重をかけて押し開け、大好きなまぐろ味のチュールを取り出した。そのとき床の小麦粉に大きな足跡がついた。カブはソファの下でチュールを食べ、袋に茶色の毛がついた。体重3.2kgのタマには扉を開けられず、窓辺のベッドで朝までぐっすり寝ていた。
    timeline:
      - id: T-01
        order: 1
        time: "21:00"
        location: 台所
        person_ids: [P-03]
        description: 飼い主さんが、まぐろ味とささみ味のチュールを1本ずつ戸棚の2段目にしまった
      - id: T-02
        order: 2
        time: "02:00"
        location: 台所
        person_ids: [P-01]
        description: カブが戸棚の扉に体重をかけて押し開け、まぐろ味のチュールを取り出した。床の小麦粉に足跡がついた
      - id: T-03
        order: 3
        time: "02:00"
        location: 窓辺
        person_ids: [P-02]
        description: タマは窓辺のベッドで朝までぐっすり寝ていた
      - id: T-04
        order: 4
        time: "02:10"
        location: ソファの下
        person_ids: [P-01]
        description: カブがソファの下でまぐろ味のチュールを食べた。袋にカブの毛がついた
      - id: T-05
        order: 5
        time: "07:00"
        location: 台所
        person_ids: [P-03]
        description: 飼い主さんが、まぐろ味のチュールがないことに気づき、ソファの下で空の袋を見つけた
    lies:
      - id: L-01
        witness_id: P-01
        false_claim: 台所には入っていない
        truth_event_id: T-02
        learning_point_ids: [LP-02]
      - id: L-02
        witness_id: P-01
        false_claim: チュールの袋にはさわっていない
        truth_event_id: T-04
        learning_point_ids: [LP-01]
      - id: L-03
        witness_id: P-01
        false_claim: 戸棚を開けたのはタマだ
        truth_event_id: T-02
        learning_point_ids: [LP-02]
      - id: L-04
        witness_id: P-01
