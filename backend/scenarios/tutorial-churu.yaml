  witness_scripts:
    - witness_id: P-01
      persona: 語尾に「にゃ」をつける食いしん坊の茶トラ白猫。都合が悪くなると、しっぽをぶんぶん振ってごまかす
      hidden_facts:
        - 夜中の2時ごろ、戸棚の扉に体重をかけて押し開け、まぐろ味のチュールを取り出した
        - ソファの下で、まぐろ味のチュールを食べた
        - まぐろ味のチュールが大好物
      lie_ids: [L-01, L-02, L-03, L-04]
      collapse_conditions:
        - lie_id: L-01
          evidence_id: CE-04
          reaction: 大きな肉球の足跡が自分のものだと認め、台所に行ったことを白状する
        - lie_id: L-02
          evidence_id: CE-01
          reaction: 袋についたしま模様の茶色の毛が自分の毛だと認め、食べてしまったことを謝る
        - lie_id: L-03
          evidence_id: CE-05
          reaction: タマの体重では扉が開かないと気づき、自分が開けたと認める
        - lie_id: L-04
          evidence_id: CE-06
          reaction: 口をすべらせたことに気づき、まぐろ味が大好物だと認める
  contradictions:
    - id: X-01
      testimony_line_id: TS-01-2
      evidence_id: CE-04
      lie_id: L-01
      learning_point_ids: [LP-02]
      explanation: カブは「台所には一歩も入ってない」と証言した。しかし台所の床には、直径およそ4cmの肉球の足跡が残っていた。プロフィールによると、肉球が4cmなのはカブ(タマは2.5cm)。カブは台所に入っている。
      traps:
        - evidence_id: CE-02
          reasoning: 戸棚が開いていたのだから、台所に入ったのはカブだ
          learning_point_id: LP-01
          why_tempting: 戸棚が開いていたことから誰かが台所に入ったとはわかるが、それがカブだとまでは言えない
    - id: X-02
      testimony_line_id: TS-01-3
