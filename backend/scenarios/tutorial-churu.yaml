      explanation: カブは「チュールの袋なんて、さわってもいない」と証言した。しかし空のチュールの袋には、しま模様の入った茶色の毛がついていた。茶色の毛はタマにもあるが、しま模様があるのはカブだけ(ねこたちのプロフィール)なので、カブは袋にさわっている。
      traps:
