    <h1>ベーシックインカム実験の結果</h1>
    <p>ある国では2年間にわたり、無作為に選ばれた失業者2,000人に毎月一定額を支給する実験を行った。</p>
    <p>実験の結果、受給者の就業日数は対照群と比べて大きな差がなかった一方で、生活満足度や健康状態の自己評価は改善した。</p>
    <p>研究チームは「就労意欲が下がるという懸念は、少なくともこの実験の範囲では確認されなかった」と述べている。</p>
    <p>一方で、財源の確保や既存の社会保障制度との統合をどう進めるかについては、今後の検討課題として残った。</p>
